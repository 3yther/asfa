<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>ASFA // COSMOS</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/cosmos-theme.css') }}">
</head>
<body class="cosmos-root">

<!-- The lensing render mounts here. Off-centre framing is a shader uniform
     (centerX), not a CSS transform, so the warp stays mathematically centred
     on the hole wherever it sits on screen. -->
<div id="cosmos-stage" class="cosmos-stage" aria-hidden="true"></div>

<!-- Static gradient shown if WebGL/Three.js never comes up, so the menu is
     never stranded on a black screen. -->
<div id="cosmos-fallback" class="cosmos-fallback" aria-hidden="true"></div>
<div class="cosmos-vignette" aria-hidden="true"></div>

<header class="cosmos-brand">
  <a class="cosmos-logo" href="/" aria-label="ASFA — dashboard"><span class="br">[</span>ASFA<span class="br">]</span></a>
</header>

<div class="cosmos-ui">
  <nav class="cosmos-menu" aria-label="Primary">
    <a href="/"><span class="lbl">Command</span></a>
    <a href="/agents"><span class="lbl">Agents</span></a>
    <a href="/approvals"><span class="lbl">Approvals</span></a>
    <a href="/system"><span class="lbl">Systems</span></a>
    <a href="/gym"><span class="lbl">Gym</span></a>
    <a href="/fragrances"><span class="lbl">Scents</span></a>
    <a href="/interview"><span class="lbl">Interview</span></a>
    <a href="/mission-control"><span class="lbl">Mission Control</span></a>
    <a href="/portfolio"><span class="lbl">Portfolio</span></a>
  </nav>
</div>

<!-- Mission-clock flavour readout, samurai's KAZE caption in a different key. -->
<div class="cosmos-caption" aria-hidden="true">
  <span id="cosmos-clock">T+00:00:00</span> <span class="sep">//</span> RELATIVISTIC DRIFT
</div>

<div id="cosmos-loader" class="cosmos-loader">
  <span class="cosmos-loader-mark">ASFA</span>
  <span class="cosmos-loader-bar"></span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>

<!-- Safety net: if the module never boots (import map unsupported, CDN blocked),
     drop the loader and reveal the static gradient rather than leaving a dead
     spinner over an empty page. Cleared by cosmos-boot once it takes over. -->
<script>
  window.__cosmosSafety = setTimeout(function () {
    var f = document.getElementById("cosmos-fallback");
    var l = document.getElementById("cosmos-loader");
    if (f) f.classList.add("show");
    if (l) l.classList.add("hidden");
  }, 9000);
</script>

<script src="{{ url_for('static', filename='js/cosmos-menu.js') }}" defer></script>
<script type="module" src="{{ url_for('static', filename='js/cosmos-boot.js') }}"></script>
</body>
</html>
